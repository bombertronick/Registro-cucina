<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Scutum ERP V15.6 Absolute</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <style>
        /* ==========================================================================
           0. KERNEL VISIVO E VARIABILI
           ========================================================================== */
        :root {
            --bg: #0D0907; --card: #201311; --sidebar-bg: rgba(20, 10, 10, 0.98);
            --accent: #C9A464; --accent-glow: rgba(201, 164, 100, 0.15);
            --text: #F2E8E4; --text-muted: #8A7270; --border: #3D2624;
            --success: #356E3B; --danger: #8C2222; --warning: #C9A464; 
            --nexus: #8A2BE2; --nexus-glow: rgba(138, 43, 226, 0.15);
            --input-bg: var(--bg); --sidebar-w: 280px; --radius-main: 16px;            
            --bezier: cubic-bezier(0.2, 0.8, 0.2, 1);
            --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
            --meandro-bg: #C9A464; --meandro-pattern: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="12" viewBox="0 0 36 12"><path d="M0,0h4v12H0zM4,4h4v4H4zM16,4h4v4h-4zM32,4h4v4h-4z" fill="rgba(201,164,100,0.15)"/></svg>');
        }

        [data-theme="light"] {
            --bg: #F9F6F0; --card: #FFFFFF; --sidebar-bg: rgba(249, 246, 240, 0.98);
            --accent: #8C2222; --accent-glow: rgba(140, 34, 34, 0.1);
            --text: #201311; --text-muted: #7A625F; --border: #E5D5C5;
            --success: #27632A; --danger: #B22222; --warning: #D2A850; 
            --nexus: #673AB7; --nexus-glow: rgba(103, 58, 183, 0.15);
            --input-bg: #F0EAE1; --meandro-bg: #8C2222; --meandro-pattern: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="12" viewBox="0 0 36 12"><path d="M0,0h4v12H0zM4,4h4v4H4zM16,4h4v4h-4zM32,4h4v4h-4z" fill="rgba(140,34,34,0.1)"/></svg>');
        }

        /* ==========================================================================
           1. RESET E STRUTTURA BASE
           ========================================================================== */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; outline: none; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); height: 100dvh; width: 100vw; overflow: hidden; display: flex; transition: background 0.4s var(--bezier), color 0.4s var(--bezier); -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        
        .spa-view { position: absolute; inset: 0; display: none; opacity: 0; pointer-events: none; z-index: 1; transition: opacity 0.3s var(--bezier), transform 0.3s var(--bezier); flex-direction: column; transform: scale(0.98); }
        .spa-view.active { display: flex; opacity: 1; pointer-events: auto; z-index: 10; transform: scale(1); }
        body.modal-open { pointer-events: none; }

        /* ==========================================================================
           2. SIDEBAR E NAVIGAZIONE
           ========================================================================== */
        .sidebar { width: var(--sidebar-w); height: 100%; background: var(--sidebar-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-right: 2px solid var(--border); display: flex; flex-direction: column; padding: 24px; z-index: 1000; flex-shrink: 0; transition: transform 0.4s var(--bezier), left 0.4s var(--bezier); position: relative; }
        .sidebar::after { content: ''; position: absolute; top: 0; right: 0; width: 6px; height: 100%; background: var(--meandro-bg); background-image: var(--meandro-pattern); opacity: 0.8; }
        .sidebar-logo { font-weight: 800; font-size: 1.5rem; display: flex; align-items: center; gap: 12px; color: var(--accent); letter-spacing: -0.5px; text-transform: uppercase; margin-bottom: 32px; }
        .nav-item { padding: 16px 18px; border-radius: var(--radius-main); display: flex; align-items: center; gap: 14px; cursor: pointer; color: var(--text-muted); font-weight: 700; font-size: 0.95rem; margin-bottom: 6px; transition: 0.2s; border: 1px solid transparent; }
        .nav-item:hover { background: var(--accent-glow); color: var(--text); } 
        .nav-item.active { background: var(--border); color: var(--accent); border-color: var(--accent-glow); }
        .nav-item.nexus { color: var(--nexus); border: 2px dashed rgba(138, 43, 226, 0.4); background: var(--nexus-glow); margin-top: 16px; font-weight: 800;}
        .nav-item.nexus:hover { background: rgba(138, 43, 226, 0.25); border-style: solid; }

<!-- FINE PARTE 1 -->
<script>
        // ==========================================================================
        // 0. CERBERO (Sicurezza e Vault Crittografico)
        // ==========================================================================
        const Cerbero = (function() {
            const SYSTEM_SALT = "Scutum_V15.6_Crypto_Salt_X91"; const VAULT_KEY = "nexus_cloud_vault"; const ROOT_PIN_KEY = "nexus_root_hash";
            const hashData = (t) => { if (!t) return null; if (typeof CryptoJS === 'undefined') throw new Error("CryptoJS assente."); return CryptoJS.SHA256(t + SYSTEM_SALT).toString(CryptoJS.enc.Hex); };
            const encryptAES = (p, s) => { if (!p || !s) return null; return CryptoJS.AES.encrypt(p, hashData(s)).toString(); };
            const decryptAES = (c, s) => { if (!c || !s) return null; try { return CryptoJS.AES.decrypt(c, hashData(s)).toString(CryptoJS.enc.Utf8) || null; } catch (e) { return null; } };
            return {
                setupRootSignature(p) { localStorage.setItem(ROOT_PIN_KEY, hashData(p)); return true; },
                verifyRootSignature(p) { const h = localStorage.getItem(ROOT_PIN_KEY); return h ? hashData(p) === h : false; },
                isSystemVirgin() { return localStorage.getItem(ROOT_PIN_KEY) === null; },
                hashOperatorPin(p) { return hashData(p); },
                verifyOperatorSignature(a, h) { return h ? hashData(a) === h : false; },
                storeCloudVault(a, p) { if (!this.verifyRootSignature(p)) throw new Error("Firma Root invalida."); localStorage.setItem(VAULT_KEY, encryptAES(a, p)); return true; },
                unlockCloudVault(p) { const e = localStorage.getItem(VAULT_KEY); if (!e) return null; const d = decryptAES(e, p); if (!d) throw new Error("Sblocco fallito. PIN Errato."); return d; },
                isCloudVaultSealed() { return localStorage.getItem(VAULT_KEY) !== null; }
            };
        })();

        // 1. MATRICE GLOBALE
        const PALETTE = ["#C9A464", "#8C2222", "#356E3B", "#D2A850", "#4A1218", "#201311", "#8A7270", "#F2E8E4", "#8A2BE2"];
        let appStructure = { sedi: {} }, appState = {};
        let activeSede = null, activeFolder = null, activeCatFilter = 'tutti';
        let editMode = false, isFifo = false, showHiddenTimeGated = false;
        let selectedColor = PALETTE[0], currentEdit = {}, activeItemDays = [];
        let activeProfile = localStorage.getItem('nexus_session') || null; 
        let clipboardSection = null, currentReportTab = 'fare';

        // 2. CORE UTILS
        function haptic(ms=20) { if(navigator.vibrate) try{navigator.vibrate(ms);}catch(e){} }
        function showToast(msg, type = 'info') { const c = document.getElementById('toast-container'); if (!c) return; const t = document.createElement('div'); t.className = `toast`; let bc = type === 'success' ? 'var(--success)' : (type === 'error' ? 'var(--danger)' : 'var(--accent)'); t.style.borderLeft = `4px solid ${bc}`; let ic = type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-triangle-exclamation' : 'fa-info-circle'); t.innerHTML = `<i class="fa-solid ${ic}" style="color:${bc}; margin-right:12px;"></i> ${msg}`; c.appendChild(t); setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(-20px)'; setTimeout(() => t.remove(), 300); }, 3500); }
        function sanitize(str) { return (str === null || str === undefined) ? "" : str.toString().replace(/[<>"]/g, "'").trim(); }
        function generateId() { return Math.random().toString(36).substring(2, 11); }
        function showModal(id) { haptic(10); const m = document.getElementById(id); if(m) { m.style.display = 'flex'; document.body.classList.add('modal-open'); history.pushState({ modal: id }, null, window.location.href); } }
        function closeModals(e = true) { let o = false; document.querySelectorAll('.modal-overlay').forEach(m => { if(m.style.display === 'flex') { o = true; m.style.animation = 'none'; m.style.opacity = '0'; setTimeout(() => { m.style.display = 'none'; m.style.opacity = '1'; m.style.animation = 'modalIn 0.3s var(--bezier) forwards'; }, 250); } }); document.body.classList.remove('modal-open'); if (o && e) history.back(); }
        window.addEventListener('popstate', () => closeModals(false));
        function switchSpaView(id) { document.querySelectorAll('.spa-view').forEach(v => v.classList.remove('active')); const t = document.getElementById(id); if(t) t.classList.add('active'); if(window.innerWidth <= 768 && id !== 'nexus-hub') { document.getElementById('sidebar').classList.remove('open'); document.getElementById('mobile-overlay').style.display='none'; } }
        function toggleTheme() { const c = document.documentElement.getAttribute('data-theme'); const n = c === 'light' ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', n); localStorage.setItem('nexus_theme', n); }
        let searchTimeoutId; const searchInputEl = document.getElementById('search-input'); if(searchInputEl) { searchInputEl.addEventListener('keyup', () => { clearTimeout(searchTimeoutId); searchTimeoutId = setTimeout(renderContentCore, 250); }); }

        // 2. CORE LAZZARO (IndexedDB Migrator V15.6 - Logic Shift)
        async function saveStructure() { try { await localforage.setItem('nexus_struct_v15_6', appStructure); } catch(e) { console.error(e); } } 
        async function saveState() { try { await localforage.setItem('nexus_state_v15_6', appState); } catch(e) { console.error(e); } }

        async function initApp() {
            if (typeof localforage !== 'undefined') localforage.config({ name: 'ScutumERP_Absolute', storeName: 'Scutum_DB' });
            else return showToast("DB Inaccessibile", "error");

            try {
                let lsStruct = localStorage.getItem('nexus_struct') || localStorage.getItem('cucina_v13_struct');
                let lsState = localStorage.getItem('nexus_state') || localStorage.getItem('cucina_v13_state');
                
                let dbStruct = await localforage.getItem('nexus_struct_v15_6') || await localforage.getItem('nexus_struct_v15_5') || await localforage.getItem('nexus_struct_v15_4') || await localforage.getItem('nexus_struct_v15_3');
                if (!dbStruct && lsStruct) dbStruct = JSON.parse(lsStruct);
                let dbState = await localforage.getItem('nexus_state_v15_6') || await localforage.getItem('nexus_state_v15_5') || await localforage.getItem('nexus_state_v15_4') || await localforage.getItem('nexus_state_v15_3');
                if (!dbState && lsState) dbState = JSON.parse(lsState);

                appState = dbState || {}; appStructure = dbStruct || { sedi: {} };
                
                if (Object.keys(appStructure.sedi).length === 0) { const sid = 'sede_1'; const fid = 'fol_1'; appStructure = { sedi: { [sid]: { id: sid, name: "COMANDO CENTRALE", folders: { [fid]: { id: fid, name: "TURNO ROOT", sections: [] } }, roles: [], checklists: [], supplierCategories: [], categories: [{id:'c1', name:'Operazioni', color:'var(--accent)', type:'action'}] } } }; }
                
                Object.values(appStructure.sedi).forEach(s => { 
                    if(!Array.isArray(s.categories) || s.categories.length === 0) s.categories = [{id:'c1', name:'Operazioni', color:'var(--accent)', type:'action'}]; 
                    s.categories.forEach(c => { if(c.type === 'standard') c.type = 'action'; if(c.type === 'magazzino') c.type = 'central_stock'; }); // Migrazione tipi vecchi
                    if(!Array.isArray(s.roles)) s.roles = []; if(!Array.isArray(s.checklists)) s.checklists = []; if(!Array.isArray(s.supplierCategories)) s.supplierCategories = []; if(!s.folders || typeof s.folders !== 'object') s.folders = {}; 
                });
                
                let migrated = false; 
                Object.keys(appState).forEach(k => {
                    let st = appState[k]; 
                    if (st && typeof st === 'object' && !Array.isArray(st)) { 
                        // Mappiamo il vecchio 'fare' o 'comprare' sul nuovo concetto universale 'done'
                        if(st.done === undefined) { st.done = (st.fare === true); migrated = true; } 
                        if(st.q === undefined) { st.q = 0; migrated = true; } 
                        if(st.n_op === undefined) { st.n_op = st.n_fare || ''; migrated = true; } 
                        // Pulizia vecchia logica
                        delete st.fare; delete st.comprare; delete st.n_fare; delete st.n_comprare; delete st.reqQty;
                    } else { delete appState[k]; migrated = true; } 
                });
                
                await saveStructure(); if(migrated) await saveState();
                
                const sKeys = Object.keys(appStructure.sedi); activeSede = sKeys.length > 0 ? sKeys[0] : null;
                if(activeSede && appStructure.sedi[activeSede].folders) { const fKeys = Object.keys(appStructure.sedi[activeSede].folders); activeFolder = fKeys.length > 0 ? fKeys[0] : null; }
                if(localStorage.getItem('nexus_theme') === 'light') document.documentElement.setAttribute('data-theme','light'); else document.documentElement.setAttribute('data-theme','dark');
                
                checkNewDayAndBackup(); checkUrlParams(); checkAuthentication(); 
            } catch(e) { console.error("Corruzione: ", e); appStructure = {sedi:{}}; appState = {}; await saveStructure(); await saveState(); initApp(); }
        }

        // 3. SICUREZZA ROOT E MACCHINA DEL TEMPO
        function setupPin() { const np = prompt("Imposta la nuova Firma Criptografica (PIN Root):"); if(np && np.trim()) { Cerbero.setupRootSignature(np.trim()); showToast("Firma Root blindata.", "success"); } }
        function checkNewDayAndBackup() { const d = new Date().toLocaleDateString('it-IT'); const bkKey = 'nexus_bkp_' + d.replace(/\//g,'-'); if (!localStorage.getItem(bkKey)) localStorage.setItem(bkKey, JSON.stringify(appStructure)); if (localStorage.getItem('nexus_day') !== d) { smartReset(true); localStorage.setItem('nexus_day', d); } }
        function openTimeMachine() { const l = document.getElementById('backup-list'); if(!l) return; l.innerHTML = ''; let bks = []; for(let i=0; i<localStorage.length; i++) { const k = localStorage.key(i); if(k && k.startsWith('nexus_bkp_')) bks.push(k); } if(bks.length === 0) { l.innerHTML = '<p style="padding: 24px; border: 1px dashed var(--border); border-radius: 12px;">Nessuna traccia.</p>'; showModal('modal-backup'); return; } bks.sort().reverse().forEach(k => { const dt = k.replace('nexus_bkp_', '').replace(/-/g, '/'); l.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg); padding:16px; border-radius:12px; border:1px solid var(--border);"><b style="font-size: 1.1rem;"><i class="fa-solid fa-clock-rotate-left" style="color:var(--warning); margin-right:12px;"></i> ${dt}</b><button class="btn-action solid" style="padding:12px 20px; width:auto; border-radius:8px; background:var(--warning); color:var(--bg); border:none;" onclick="restoreBackup('${k}')">RIPRISTINA</button></div>`; }); showModal('modal-backup'); }
        async function restoreBackup(k) { if(confirm("La matrice logica verrà sovrascritta irreversibilmente. Procedere?")) { try { const bd = localStorage.getItem(k); if(!bd) throw new Error("Corrotto."); appStructure = JSON.parse(bd); await saveStructure(); showToast("Ripristinato.", "success"); setTimeout(() => location.reload(), 800); } catch(e) { showToast("Errore ripristino.", "error"); } } }

        // 4. AUTH E FISARMONICA LOGIN
        function checkAuthentication() { if(!activeProfile) { renderAuthProfiles(); switchSpaView('auth-screen'); } else routeUser(); }
        function renderAuthProfiles() { 
            const c = document.getElementById('login-accordion-container'); const d = document.getElementById('login-selected-display'); const h = document.getElementById('login-selected-user');
            if(!c) return; c.innerHTML = ''; h.value = ''; d.style.display = 'none'; document.getElementById('login-selected-name').innerText = '';
            let html = `<div class="accordion-group"><div class="accordion-header" onclick="toggleAccordion('acc-root')"><span><i class="fa-solid fa-chess-king" style="color:var(--accent); margin-right:8px;"></i> SISTEMA ASSOLUTO</span><i class="fa-solid fa-chevron-down" id="icon-acc-root" style="transition:0.3s; color:var(--text-muted);"></i></div><div class="accordion-body" id="body-acc-root"><button class="accordion-btn" onclick="selectLoginUser('admin', 'Root / Area Manager')">Root / Area Manager</button></div></div>`;
            if(activeSede && appStructure.sedi[activeSede]) { 
                const roles = appStructure.sedi[activeSede].roles || []; const grps = {}; 
                roles.forEach(r => { const gn = (r.group && r.group.trim() !== "") ? sanitize(r.group).toUpperCase() : "OPERATIVITÀ BASE"; if(!grps[gn]) grps[gn] = []; grps[gn].push(r); }); 
                let idx = 0; for(let g in grps) { let aId = `acc-grp-${idx}`; html += `<div class="accordion-group"><div class="accordion-header" onclick="toggleAccordion('${aId}')"><span><i class="fa-solid fa-users" style="color:var(--text-muted); margin-right:8px;"></i> ${g}</span><i class="fa-solid fa-chevron-down" id="icon-${aId}" style="transition:0.3s; color:var(--text-muted);"></i></div><div class="accordion-body" id="body-${aId}">`; grps[g].forEach(r => { const tl = r.type === 'checklist' ? ' <span style="font-size:0.75rem; color:var(--warning);">[Isolato]</span>' : ''; html += `<button class="accordion-btn" onclick="selectLoginUser('${r.id}', '${sanitize(r.name).replace(/'/g, "\\'")}')">${sanitize(r.name)}${tl}</button>`; }); html += `</div></div>`; idx++; } 
            } c.innerHTML = html;
        }
        function toggleAccordion(id) { haptic(); const b = document.getElementById(`body-${id}`); const i = document.getElementById(`icon-${id}`); const o = b.classList.contains('open'); document.querySelectorAll('.accordion-body').forEach(x => x.classList.remove('open')); document.querySelectorAll('.accordion-header i.fa-chevron-down').forEach(x => x.style.transform = 'rotate(0deg)'); if(!o) { b.classList.add('open'); i.style.transform = 'rotate(180deg)'; } }
        function selectLoginUser(id, name) { haptic(); document.getElementById('login-selected-user').value = id; document.getElementById('login-selected-name').innerText = name.toUpperCase(); document.getElementById('login-selected-display').style.display = 'block'; document.querySelectorAll('.accordion-btn').forEach(b => b.classList.remove('selected')); event.currentTarget.classList.add('selected'); }
        async function performLogin() { 
            const sid = document.getElementById('login-selected-user').value; const pin = document.getElementById('login-password').value; 
            if(!sid) return showToast("Seleziona identità.", "error");
            if(sid === 'admin') { if(Cerbero.isSystemVirgin()) { Cerbero.setupRootSignature(pin || '0000'); finalizeLogin('admin'); return showToast("Firma Root istanziata.", "success"); } if(Cerbero.verifyRootSignature(pin)) finalizeLogin('admin'); else showToast("Respinta.", "error"); } 
            else { const r = appStructure.sedi[activeSede].roles.find(x => x.id === sid); const im = Cerbero.verifyRootSignature(pin); if(r) { if(r.pin && !r.pinHash) { r.pinHash = Cerbero.hashOperatorPin(r.pin); delete r.pin; await saveStructure(); } if(Cerbero.verifyOperatorSignature(pin, r.pinHash) || r.pin === pin || im) finalizeLogin(r.id); else showToast("Respinta.", "error"); } else showToast("Non trovata.", "error"); } 
            document.getElementById('login-password').value = ''; haptic(40);
        }
        function finalizeLogin(id) { activeProfile = id; localStorage.setItem('nexus_session', id); showToast("Accesso Consentito.", "success"); routeUser(); }
        function routeUser() { const r = activeProfile !== 'admin' ? appStructure.sedi[activeSede].roles.find(x => x.id === activeProfile) : null; if(r && r.type === 'checklist') { renderChecklistHub(); switchSpaView('checklist-hub'); } else { applyRolePermissions(); renderApp(); switchSpaView('app-wrapper'); } }
        function logout() { activeProfile = null; localStorage.removeItem('nexus_session'); editMode = false; document.body.classList.remove('edit-mode'); checkAuthentication(); }
        // 5. PERMISSIONS E VETTORI
        function applyRolePermissions() { const isM = (activeProfile === 'admin'); document.querySelectorAll('.manager-only').forEach(e => e.style.display = isM ? 'flex' : 'none'); const l = document.getElementById('current-user-label'); if(l) { if(isM) { l.innerText = "ROOT"; activeCatFilter = 'tutti'; } else { const r = appStructure.sedi[activeSede].roles.find(x => x.id === activeProfile); l.innerText = r ? r.name.toUpperCase() : "OPERATORE"; if(r && r.allowedCats && r.allowedCats.length > 0) activeCatFilter = r.allowedCats[0]; } } }
        function renderChecklistHub() { const c = document.getElementById('checklist-buttons-container'); if(!c) return; c.innerHTML = ''; const cks = appStructure.sedi[activeSede].checklists || []; if(cks.length === 0) { c.innerHTML = '<div style="text-align:center; padding:40px;">Nessun vettore connesso.</div>'; return; } cks.forEach(k => { c.innerHTML += `<a href="${sanitize(k.url)}" target="_blank" rel="noopener noreferrer" style="background:var(--card); border:2px solid ${k.color}; padding:32px; border-radius:var(--radius-main); text-align:center; display:flex; flex-direction:column; align-items:center; gap:16px; text-decoration:none;"><i class="fa-solid fa-link" style="color:${k.color}; font-size:40px;"></i><h3 style="color:var(--text); font-weight:800; margin:0;">${sanitize(k.name)}</h3><span style="font-size:0.9rem; background:var(--input-bg); border:1px solid var(--border); padding:10px 20px; border-radius:100px; color:var(--text-muted); font-weight:700;">INNESCA NODO</span></a>`; }); }
        function openChecklistManager() { const l = document.getElementById('checklist-links-editor'); if(!l) return; l.innerHTML = ''; const cks = appStructure.sedi[activeSede].checklists || []; cks.forEach(k => { l.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; background:var(--input-bg); padding:16px; border-radius:12px; margin-bottom:12px; border:1px solid var(--border);"><div><b style="color:var(--text);"><i class="fa-solid fa-circle" style="color:${k.color}; font-size:10px; margin-right:8px;"></i>${sanitize(k.name)}</b><span style="font-size:0.8rem; color:var(--text-muted); display:block;">${sanitize(k.url)}</span></div><button class="btn-action" style="padding:12px; width:auto; color:var(--danger);" onclick="deleteChecklistLink('${k.id}')"><i class="fa-solid fa-trash"></i></button></div>`; }); showModal('modal-checklist-manager'); }
        async function addChecklistLink() { const n = sanitize(document.getElementById('new-checklist-name').value); const u = sanitize(document.getElementById('new-checklist-url').value); const c = document.getElementById('new-checklist-color').value; if(!n || !u) return showToast("Compila Label e URI.", "error"); if(!appStructure.sedi[activeSede].checklists) appStructure.sedi[activeSede].checklists = []; appStructure.sedi[activeSede].checklists.push({ id: 'ck_' + generateId(), name: n, url: u, color: c }); await saveStructure(); document.getElementById('new-checklist-name').value = ''; document.getElementById('new-checklist-url').value = ''; openChecklistManager(); }
        async function deleteChecklistLink(id) { if(confirm("Tranciare?")) { appStructure.sedi[activeSede].checklists = appStructure.sedi[activeSede].checklists.filter(x => x.id !== id); await saveStructure(); openChecklistManager(); } }

        function renderContent(instant = false) { if(instant) { clearTimeout(searchTimeoutId); renderContentCore(); } else { clearTimeout(searchTimeoutId); searchTimeoutId = setTimeout(renderContentCore, 250); } }
        function checkExpiry(ds) { if(!ds) return ""; let e = new Date(ds); let t = new Date(); t.setHours(0,0,0,0); let d = Math.ceil((e - t) / (1000 * 60 * 60 * 24)); if(d < 0) return "<span style='font-size:0.8rem; padding:4px 10px; border-radius:6px; background:var(--danger); color:white; font-weight:800;'>SCADUTO</span>"; if(d === 0) return "<span style='font-size:0.8rem; padding:4px 10px; border-radius:6px; background:var(--warning); color:black; font-weight:800;'>OGGI</span>"; if(d <= 2) return `<span style='font-size:0.8rem; padding:4px 10px; border-radius:6px; background:var(--warning); color:black; font-weight:800;'>${d}gg</span>`; return `<span style='font-size:0.8rem; padding:4px 10px; border-radius:6px; background:var(--card); border:1px solid var(--border); color:var(--text-muted); font-weight:800;'>Scad: ${e.toLocaleDateString('it-IT')}</span>`; }

        function renderContentCore() {
            const c = document.getElementById('main-content'); if(!c) return; c.innerHTML = ''; 
            const si = document.getElementById('search-input'); const q = si ? si.value.toLowerCase().trim() : '';

            const fol = appStructure.sedi[activeSede].folders[activeFolder]; const cd = new Date().getDay();
            const bp = document.getElementById('floating-paste-btn'); if(bp) bp.style.display = (clipboardSection && editMode) ? 'flex' : 'none';
            
            fol.sections.forEach(sec => {
                let itemsToShow = sec.items.filter(i => { const mc = activeCatFilter === 'tutti' || i.catId === activeCatFilter; const ms = q === '' || i.n.toLowerCase().includes(q) || (i.info && i.info.toLowerCase().includes(q)); const it = !i.days || i.days.length === 0 || i.days.includes(cd); return mc && ms && (editMode || showHiddenTimeGated || it); });
                if(isFifo) itemsToShow.sort((a,b) => { let da = a.expiry ? new Date(a.expiry).getTime() : 9999999999999; let db = b.expiry ? new Date(b.expiry).getTime() : 9999999999999; return da - db; });
                if(itemsToShow.length === 0 && !editMode) return;
                
                const crd = document.createElement('div'); crd.className = 'card';
                let html = `<div class="card-header"><span style="color:${sec.color}">${sanitize(sec.name)}</span>${editMode && q === '' && !isFifo ? `<div style="display:flex; gap:16px;"><i class="fa-solid fa-copy" style="cursor:pointer; color:var(--accent);" onclick="copySection('${sec.id}')"></i><i class="fa-solid fa-arrow-up" style="cursor:pointer; color:var(--text-muted);" onclick="moveSection('${sec.id}',-1)"></i><i class="fa-solid fa-arrow-down" style="cursor:pointer; color:var(--text-muted);" onclick="moveSection('${sec.id}',1)"></i><i class="fa-solid fa-pen" style="cursor:pointer; color:var(--warning);" onclick="openSectionModal('${sec.id}')"></i><i class="fa-solid fa-trash" style="cursor:pointer; color:var(--danger);" onclick="deleteSection('${sec.id}')"></i></div>` : ''}<div class="card-progress-bg"><div class="card-progress-fill" id="prog-${sec.id}"></div></div></div><div style="overflow-x:auto;"><table>`;
                
                itemsToShow.forEach(i => {
                    const k = `${activeSede}_${activeFolder}_${sec.id}_${i.id}`; 
                    let st = appState[k] || {done:false, q:0, n_op:''};
                    const cat = appStructure.sedi[activeSede].categories.find(x => x.id === i.catId) || {name:'ERR', color:'#ccc', type:'action'};
                    
                    let bdg = `<span class="role-badge" style="background:${cat.color}; border-color:${cat.color};">${sanitize(cat.name).toUpperCase()}</span>`; 
                    const expA = checkExpiry(i.expiry);
                    let meta = "";
                    
                    let deficit = 0;
                    if(cat.type === 'inventory') {
                        deficit = Math.max(0, (i.idealQty || 0) - st.q);
                        meta += `<span class="target-badge"><i class="fa-solid fa-bullseye"></i> Target: ${i.idealQty}</span> `;
                        if(i.nexusSedeId) meta += `<span class="nexus-badge"><i class="fa-solid fa-truck-fast"></i> NEXUS ESTERNO</span> `;
                    } else if (cat.type === 'central_stock') {
                        if(i.uom) meta += `<span class="uom-badge">${sanitize(i.uom)}</span> `;
                    } else {
                        if(i.l) meta += `<span style="background:var(--input-bg); padding:4px 8px; border-radius:6px; border:1px solid var(--border);"><b>L:</b> ${sanitize(i.l)}</span> `; 
                        if(i.s) meta += `<span style="background:var(--input-bg); padding:4px 8px; border-radius:6px; border:1px solid var(--border);"><b>S:</b> ${sanitize(i.s)}</span> `;
                    }

                    if(i.info && i.info.trim() !== "") meta += `<span class="info-badge" onclick="openInfoModal('${sec.id}','${i.id}')" style="padding:4px 8px; border-radius:6px; background:var(--accent-glow); border:1px solid rgba(201, 164, 100, 0.3); color:var(--accent); cursor:pointer;"><i class="fa-solid fa-book-open"></i> Info</span> `;
                    const isO = !editMode && i.days && i.days.length > 0 && !i.days.includes(cd); 
                    if(isO) meta += ` <span style="font-size:0.75rem; color:var(--warning); font-weight:800; border:1px solid var(--warning); padding:2px 6px; border-radius:4px;"><i class="fa-solid fa-eye"></i> EXTRA</span>`;
                    if(expA) meta += expA;
                    
                    let act = '';
                    let isFulfilled = false;

                    if (cat.type === 'action') {
                        act = `<button id="btn-act-${k}" class="btn-massive-action ${st.done?'done':''}" onclick="toggleDone('${k}', '${sec.id}')">${st.done ? '<i class="fa-solid fa-check-double"></i> COMPLETATO' : '<i class="fa-regular fa-square"></i> FATTO?'}</button>`;
                    } else if (cat.type === 'inventory') {
                        let containerClass = "qty-container";
                        if (deficit > 0) { containerClass += i.nexusSedeId ? " is-nexus-deficit" : " is-deficit"; }
                        
                        if(i.nexusSedeId && st.done) {

                        } else {

                        }
                    } else if (cat.type === 'central_stock') {
                        act = `<div style="display:flex; flex-direction:column; gap:8px;"><div style="font-size:0.8rem; color:var(--text-muted); font-weight:800; text-transform:uppercase;">Giacenza Attuale</div><div class="qty-container" style="border-color:var(--accent);"><button class="qty-btn minus" onclick="updateQty('${k}',-1, '${sec.id}')"><i class="fa-solid fa-minus"></i></button><input type="number" class="qty-input" id="qty-${k}" value="${st.q||0}" onchange="updateQtyDirect('${k}',this.value, '${sec.id}')"><button class="qty-btn plus" onclick="updateQty('${k}',1, '${sec.id}')"><i class="fa-solid fa-plus"></i></button></div></div>`;
                    }
                    
                    const rowClass = (st.done && cat.type === 'action') || isFulfilled ? 'is-fulfilled' : '';
                    html += `<tr id="row-${k}" class="${rowClass} ${isO?'out-of-schedule':''}">
                        <td><span class="prod-name">${sanitize(i.n)} ${bdg}</span><span class="prod-meta">${meta}</span>
                        ${editMode && q === '' && !isFifo ? `<div style="display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;"><button class="btn-action" style="padding:12px 16px; width:auto; border-radius:10px; background:var(--input-bg); border:1px solid var(--border); color:var(--text);" onclick="moveItem('${sec.id}','${i.id}',-1)"><i class="fa-solid fa-arrow-up"></i></button><button class="btn-action" style="padding:12px 16px; width:auto; border-radius:10px; background:var(--input-bg); border:1px solid var(--border); color:var(--text);" onclick="moveItem('${sec.id}','${i.id}',1)"><i class="fa-solid fa-arrow-down"></i></button><button class="btn-action" style="padding:12px 16px; width:auto; background:var(--warning); border:none; color:#000; border-radius:10px;" onclick="openItemModal('${sec.id}','${i.id}')"><i class="fa-solid fa-pen"></i></button><button class="btn-action" style="padding:12px 16px; width:auto; background:var(--danger); border:none; color:white; border-radius:10px;" onclick="deleteItem('${sec.id}','${i.id}')"><i class="fa-solid fa-trash"></i></button></div>` : ''}
                        <input type="text" class="note-input" value="${sanitize(st.n_op)}" onblur="updateState('${k}','n_op',this.value)" placeholder="Aggiungi una nota visibile...">
                        </td><td style="text-align:right;">${act}</td></tr>`;
                });
                
                html += `</table></div>`;
                if(editMode && q === '') html += `<button class="btn-action solid" style="width:100%; border-radius:0 0 var(--radius-main) var(--radius-main); margin-top:0; padding:24px;" onclick="openItemModal('${sec.id}')"><i class="fa-solid fa-plus"></i> AGGIUNGI NODO PRODOTTO</button>`;
                crd.innerHTML = html; c.appendChild(crd); updateProgressBar(sec.id);
            });
            if(editMode && q === '') { const b = document.createElement('button'); b.className = 'btn-action'; b.style.background = 'var(--bg)'; b.style.border = '2px dashed var(--success)'; b.style.color = 'var(--success)'; b.innerHTML = '<i class="fa-solid fa-plus"></i> COSTRUISCI CELLA LOGICA'; b.onclick = () => openSectionModal(); c.appendChild(b); }
        }

        function updateProgressBar(id) { const p = document.getElementById(`prog-${id}`); if(!p) return; const s = appStructure.sedi[activeSede].folders[activeFolder].sections.find(x => x.id === id); if(!s) return; let d = 0, t = 0; s.items.forEach(i => { const c = appStructure.sedi[activeSede].categories.find(x => x.id === i.catId) || {}; if(c.type === 'action') { t++; const st = appState[`${activeSede}_${activeFolder}_${id}_${i.id}`]; if(st && st.done) d++; } }); if(t > 0) { const pct = Math.round((d / t) * 100); p.style.width = pct + '%'; p.style.background = pct === 100 ? 'var(--success)' : 'var(--warning)'; } else p.style.width = '0%'; }
        
        async function toggleDone(k, sid) { haptic(40); if(!appState[k]) appState[k] = {done:false, q:0, n_op:''}; appState[k].done = !appState[k].done; await saveState(); renderContent(true); }
        async function updateQty(k, d, sid) { haptic(20); if(!appState[k]) appState[k] = {done:false, q:0, n_op:''}; appState[k].q = Math.max(0, (appState[k].q || 0) + d); await saveState(); renderContent(true); }

        function toggleFIFO() { isFifo = !isFifo; const b = document.getElementById('btn-fifo'); if(b) { b.style.background = isFifo ? "var(--accent)" : "var(--card)"; b.style.color = isFifo ? "var(--bg)" : "var(--text-muted)"; } renderContent(true); }
        async function smartReset(isA = false) { if(isA || confirm("Iniziare un nuovo turno? Verranno rimosse le spunte sulle azioni e sbloccati gli ordini evasi.")) { for(let k in appState) { appState[k].done = false; appState[k].n_op = ''; } await saveState(); renderContent(true); if(!isA) showToast("Nuovo Turno Iniziato.", "success"); } }
        function requestEditMode() { editMode = !editMode; document.body.classList.toggle('edit-mode', editMode); const b = document.getElementById('sidebar-edit-status'); if(b) { b.innerHTML = editMode ? `<i class="fa-solid fa-lock"></i> BLOCCA MODIFICHE` : `<i class="fa-solid fa-unlock"></i> SBLOCCA MODIFICHE`; b.style.background = editMode ? "var(--warning)" : "transparent"; b.style.color = editMode ? "#000" : "var(--text)"; } document.querySelectorAll('.edit-only').forEach(e => e.style.display = editMode ? 'flex' : 'none'); renderApp(); }
        // 7. CRUD MANAGERS (Modali Amministrativi)
        function openSedeModal(id = null) { currentEdit = { action: id ? 'edit' : 'new', id: id }; document.getElementById('input-sede-name').value = id ? appStructure.sedi[id].name : ''; showModal('modal-sede'); }

        function buildReports() { 
            if(!activeSede || !activeFolder) return; const f = appStructure.sedi[activeSede].folders[activeFolder]; const isM = (activeProfile === 'admin'); const r = !isM ? appStructure.sedi[activeSede].roles.find(x => x.id === activeProfile) : null; const aC = r ? r.allowedCats : null; let fg = {}, cg = {}; csvF = []; csvC = []; 
            f.sections.forEach(s => s.items.forEach(i => { if (!isM && aC && !aC.includes(i.catId)) return; const k = `${activeSede}_${activeFolder}_${s.id}_${i.id}`; const st = appState[k] || {done:false, q:0, n_op:''}; const c = appStructure.sedi[activeSede].categories.find(x => x.id === i.catId) || {name:'N.C.', type:'action'}; 
                
                if(c.type === 'action' && st.done) { let cn = sanitize(c.name).toUpperCase(); if(!fg[cn]) fg[cn] = []; let nf = st.n_op && st.n_op.trim() !== "" ? sanitize(st.n_op) : "Eseguito"; fg[cn].push({p: sanitize(i.n), n: nf, s: sanitize(s.name)}); csvF.push({t: "AZIONE", g: cn, s: sanitize(s.name), p: sanitize(i.n), v: nf}); } 
                
                if(c.type === 'inventory') {
                    let deficit = Math.max(0, (i.idealQty || 0) - (st.q || 0));
                    if(deficit > 0 && !st.done) { 
                        let sn = 'ORDINE GLOBALE'; let tbv = `Deficit: ${deficit}`;
                        if(i.nexusSedeId) { sn = appStructure.sedi[i.nexusSedeId] ? sanitize(appStructure.sedi[i.nexusSedeId].name).toUpperCase() : 'PRODUZIONE CENTRALE'; tbv += ` (Nexus)`; } 
                        else if(i.supplierCatId) { const so = (appStructure.sedi[activeSede].supplierCategories || []).find(x => x.id === i.supplierCatId); if(so) sn = sanitize(so.name).toUpperCase(); } 
                        else if(i.supplier) { sn = sanitize(i.supplier).toUpperCase(); } 
                        if(st.n_op && st.n_op.trim() !== "") tbv += ` | Note: ${sanitize(st.n_op)}`;
                        
                        if(!cg[sn]) cg[sn] = []; cg[sn].push({p: sanitize(i.n), n: tbv, s: sanitize(s.name)}); csvC.push({t: "ORDINE", g: sn, s: sanitize(s.name), p: sanitize(i.n), v: tbv});
                    }
                }
            })); 

            const rootSedeName = sanitize(appStructure.sedi[activeSede].name).toUpperCase();
            rtF = ""; if(Object.keys(fg).length > 0) { rtF += `🎯 AZIONI FATTE [${rootSedeName}]:\n`; for(let c in fg) { rtF += `\n[ ${c} ]\n`; fg[c].forEach(p => rtF += `• ${p.p} (${p.s}): ${p.n}\n`); } } else { rtF = `✅ Nessuna operazione segnata in ${rootSedeName}.`; } 
            rtC = ""; if(Object.keys(cg).length > 0) { rtC += `🛒 ORDINI NECESSARI [${rootSedeName}]:\n`; for(let s in cg) { rtC += `\n[ ${s} ]\n`; cg[s].forEach(o => rtC += `• ${o.p}: ${o.n}\n`); } } else { rtC = `✅ Magazzini in Target in ${rootSedeName}.`; } 
            let hF = `<div>`; if(Object.keys(fg).length === 0) hF += `<div style="text-align:center;padding:40px;color:var(--success);"><i class="fa-solid fa-check-double" style="font-size:4rem; margin-bottom:16px;"></i><br><b>Vuoto</b></div>`; else { for(let c in fg) { hF += `<div style="margin-bottom:16px;"><b style="color:var(--warning);font-size:0.9rem; letter-spacing:1px;">${c}</b>`; fg[c].forEach(p => { hF += `<div style="background:rgba(201,164,100,0.05);padding:16px;margin:8px 0;border-left:4px solid var(--warning);border-radius:0 12px 12px 0;"><b>${p.p}</b> <span style="font-size:0.85rem;color:var(--text-muted)">(${p.s})</span><br><span style="color:var(--accent);font-size:1rem; display:block; margin-top:6px;">${p.n}</span></div>`; }); hF += `</div>`; } } hF += `</div>`; document.getElementById('report-preview-fare').innerHTML = hF; 
            let hC = `<div>`; if(Object.keys(cg).length === 0) hC += `<div style="text-align:center;padding:40px;color:var(--success);"><i class="fa-solid fa-boxes-stacked" style="font-size:4rem; margin-bottom:16px;"></i><br><b>Sede in Target Ideale</b></div>`; else { for(let s in cg) { hC += `<div style="background:var(--card);padding:16px;border-radius:16px;border:1px solid var(--border);margin-bottom:16px;"><b style="color:var(--text-muted);font-size:0.9rem;display:block;margin-bottom:12px; letter-spacing:1px;"><i class="fa-solid fa-truck"></i> ${s}</b>`; cg[s].forEach(o => { hC += `<div style="display:flex;justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px dashed var(--border);"><span style="font-weight:700; font-size:1.05rem;">${o.p}</span><span style="background:rgba(201,164,100,0.15);color:var(--accent);padding:8px 12px;border-radius:100px;font-weight:800;font-size:0.9rem;">${o.n}</span></div>`; }); hC += `</div>`; } } hC += `</div>`; document.getElementById('report-preview-comprare').innerHTML = hC; 
        }

        function shareApp() { const sa = localStorage.getItem('nexus_alias'); const sh = localStorage.getItem('nexus_hub_id'); let u = ''; if(sa) u = `?alias=${sa}`; else if(sh) u = `?hub=${sh}`; const su = window.location.href.split('?')[0] + u; if(navigator.share) navigator.share({title:'Scutum ERP', url:su}).catch(console.error); else navigator.clipboard.writeText(su).then(() => showToast("Link Copiato.", "success")); }
        function checkUrlParams() { try { const u = new URLSearchParams(window.location.search); const pa = u.get('alias'); const ph = u.get('hub'); if(pa) localStorage.setItem('nexus_alias', pa); if(ph) localStorage.setItem('nexus_hub_id', ph); if(pa || ph) { window.history.replaceState({}, document.title, window.location.pathname); showToast("Cloud Agganciato.", "success"); } } catch(e) {} }

        async function resolveAliasToId(a) { let ca = a.replace(/[^a-zA-Z0-9]/g, '').toLowerCase(); if(ca && ca.length >= 24) return ca; if(ca && ca.length > 0 && ca.length < 24) { try { let r = await fetch(`https://keyvalue.immanuel.co/api/KeyVal/GetValue/ScutumERP_${ca}`); let v = r.ok ? await r.text() : null; if(v && v.length > 10 && !v.includes("Error") && !v.includes("null")) return v.replace(/"/g,'').trim(); return null; } catch(e) { return null; } } return null; }
        async function registerAliasMapping(a, h) { let ca = a.replace(/[^a-zA-Z0-9]/g, '').toLowerCase(); if(ca && ca.length > 0 && ca.length < 24) { try { await fetch(`https://keyvalue.immanuel.co/api/KeyVal/UpdateValue/ScutumERP_${ca}/${h}`, {method:'POST'}); } catch(e){} } }

        function openCloudHub() { 
            const s = Cerbero.isCloudVaultSealed(); 
            document.getElementById('cloud-vault-setup').style.display = s ? 'none' : 'block'; 
            document.getElementById('cloud-legacy-restore').style.display = s ? 'none' : 'block';
            document.getElementById('cloud-sync-ops').style.display = s ? 'block' : 'none'; 
            document.getElementById('cloud-alias-input').value = localStorage.getItem('nexus_alias') || localStorage.getItem('nexus_hub_id') || ''; 
            document.getElementById('cloud-auth-pin').value = ''; 
            showModal('modal-cloud'); 
            if(s && localStorage.getItem('nexus_hub_id')) fetchCloudVersions(localStorage.getItem('nexus_hub_id'), document.getElementById('cloud-versions-list')); 
        }

        function sealVault() { const a = document.getElementById('setup-api-key').value.trim(); const p = document.getElementById('setup-root-pin').value; if(!a || !p) return showToast("Dati mancanti.", "error"); try { Cerbero.storeCloudVault(a, p); showToast("Vault Sigillato.", "success"); openCloudHub(); } catch (e) { showToast(e.message, "error"); } }
        async function fetchCloudVersions(h, l) { l.innerHTML = `<div style="text-align:center;padding:24px;color:var(--accent);"><i class="fa-solid fa-spinner fa-spin"></i> Connessione...</div>`; try { const res = await fetch(`https://api.jsonbin.io/v3/b/${h}/latest`); if(!res.ok) throw new Error(); const d = await res.json(); if(d.record && d.record.metadata) { const m = d.record.metadata; l.innerHTML = `<div style="background:var(--card);border:1px solid var(--border);padding:16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;"><div><b style="font-size:1.1rem; color:var(--accent);">${sanitize(m.version_name)}</b><div style="font-size:0.8rem;color:var(--text-muted);">${new Date(m.timestamp).toLocaleString('it-IT')}</div></div><div style="color:var(--success);font-weight:800; border:1px solid var(--success); padding:4px 8px; border-radius:6px;">Online</div></div>`; } } catch(e) { l.innerHTML = "<div style='color:var(--danger);text-align:center;'>Irrilevabile.</div>"; } }
        
        async function uploadToCloudHub() { const ia = document.getElementById('cloud-alias-input').value.trim(); const pin = document.getElementById('cloud-auth-pin').value; if(!ia || !pin) return showToast("ID/PIN Obbligatori.", "error"); if(!confirm("Sovrascriverà la memoria Cloud. Continuare?")) return; let ak; try { ak = Cerbero.unlockCloudVault(pin); } catch(e) { return showToast(e.message, "error"); } const p = {metadata:{version_name:`Sincronizzazione Scutum 15.6`, timestamp:new Date().toISOString()}, data:appStructure}; showToast("Upload in Corso...", "info"); try { let res; let rid = await resolveAliasToId(ia); if(rid && rid.length >= 24) { res = await fetch(`https://api.jsonbin.io/v3/b/${rid}`, {method:'PUT', headers:{'Content-Type':'application/json','X-Master-Key':ak}, body:JSON.stringify(p)}); if(!res.ok) throw new Error(); } else { res = await fetch('https://api.jsonbin.io/v3/b', {method:'POST', headers:{'Content-Type':'application/json','X-Master-Key':ak,'X-Bin-Name':'Scutum_ERP'}, body:JSON.stringify(p)}); const d = await res.json(); if(!d || !d.metadata) throw new Error(); rid = d.metadata.id; } await registerAliasMapping(ia, rid); let ca = ia.replace(/[^a-zA-Z0-9]/g, '').toLowerCase(); localStorage.setItem('nexus_hub_id', rid); localStorage.setItem('nexus_alias', ca.length > 0 ? ca : rid); const m = document.getElementById('cloud-status-message'); m.innerHTML = `ALLINEATO!<br><b style="color:var(--bg); font-size:1rem; letter-spacing:1px; background:var(--accent); padding:10px 16px; border-radius:8px; display:inline-block; margin-top:10px;">${rid}</b>`; m.style.display = 'block'; fetchCloudVersions(rid, document.getElementById('cloud-versions-list')); showToast("Dati Caricati.", "success"); } catch(e) { showToast("Fallimento Server.", "error"); } finally { ak = null; } }
        
        async function downloadFromCloudHub() { const ia = document.getElementById('cloud-alias-input').value.trim(); const pin = document.getElementById('cloud-auth-pin').value; if(!ia || !pin) return showToast("ID/PIN Obbligatori.", "error"); if(!confirm("I dati locali verranno annientati. Procedere?")) return; let ak; try { ak = Cerbero.unlockCloudVault(pin); } catch(e) { return showToast(e.message, "error"); } _executeDownload(ia, ak); }
        function downloadLegacyCloudHub() { const ia = document.getElementById('legacy-alias-input').value.trim(); if(!ia) return showToast("Inserisci l'Alias.", "error"); if(!confirm("Verranno recuperati i vecchi dati. Confermi?")) return; _executeDownload(ia, LEGACY_CLOUD_KEY); }

        async function _executeDownload(ia, ak) { showToast("Ricerca...", "info"); try { let rid = await resolveAliasToId(ia); if(!rid) throw new Error("ID non trovato."); const res = await fetch(`https://api.jsonbin.io/v3/b/${rid}/latest`, {headers:{'X-Master-Key':ak}}); if(!res.ok) throw new Error("Cloud irraggiungibile o chiave errata."); const j = await res.json(); if(j.record && j.record.data) { appStructure = j.record.data; let ca = ia.replace(/[^a-zA-Z0-9]/g, '').toLowerCase(); localStorage.setItem('nexus_hub_id', rid); localStorage.setItem('nexus_alias', ca.length > 0 ? ca : rid); await saveStructure(); closeModals(); initApp(); showToast("Acquisita con Successo.", "success"); } } catch(e) { showToast(e.message, "error"); } }

        window.onload = () => { initApp(); };
    </script>
</body>
</html>
