<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cucina Manager V4</title>

            <style>
        :root {
            --primary: #0f172a; --accent: #38bdf8; --success: #10b981;
            --danger: #ef4444; --warning: #f59e0b; --bg: #f8fafc;
            --card: #ffffff; --text: #1e293b; --text-muted: #64748b;
            --border: #e2e8f0; --sidebar-w: 260px;
            --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        [data-theme="dark"] {
            --bg: #020617; --card: #1e293b; --text: #f8fafc;
            --text-muted: #94a3b8; --border: #334155; --primary: #f8fafc;
        }

        /* RESET GLOBALE E FIX ALTEZZA */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Urbanist', sans-serif; background: var(--bg); color: var(--text); 
            display: flex; height: 100dvh; width: 100vw; overflow: hidden; overscroll-behavior: none; 
            transition: background 0.3s, color 0.3s; 
        }
        body.edit-mode { background: repeating-linear-gradient(45deg, var(--bg), var(--bg) 10px, rgba(245, 158, 11, 0.05) 10px, rgba(245, 158, 11, 0.05) 20px); }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        /* SIDEBAR */
        .sidebar { width: var(--sidebar-w); height: 100%; background: var(--primary); color: white; display: flex; flex-direction: column; transition: 0.3s; z-index: 1001; position: relative; box-shadow: 2px 0 15px rgba(0,0,0,0.1); }
        .sidebar-header { padding: calc(20px + var(--safe-top)) 20px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
        .sidebar-header h1 { font-family: 'Poppins', sans-serif; font-size: 1.2rem; color: var(--accent); }
        .nav-group { padding: 20px 0; flex-grow: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .nav-label { padding: 0 25px 10px; font-size: 10px; font-weight: 800; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; }
        .nav-item { padding: 12px 25px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: rgba(255,255,255,0.7); font-weight: 600; transition: 0.2s; font-size: 14px; }
        .nav-item i { width: 20px; text-align: center; font-size: 16px; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: var(--accent); color: var(--primary); font-weight: 800; }
        .sidebar-footer { padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-bottom: calc(15px + var(--safe-bottom)); flex-shrink: 0; }
        .nav-item.edit-btn { color: var(--warning); border-radius: 10px; justify-content: center; background: rgba(245, 158, 11, 0.1); }

        /* HEADER E AREA PRINCIPALE */
        main { flex: 1; display: flex; flex-direction: column; height: 100dvh; width: calc(100vw - var(--sidebar-w)); position: relative; }
        .top-bar { height: calc(65px + var(--safe-top)); background: var(--card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: var(--safe-top) 20px 0; z-index: 10; flex-shrink: 0; }
        .view-title { font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .btn-icon { background: var(--bg); border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; font-size: 16px; flex-shrink: 0; }

        /* TOOLBAR (CARTELLE E RICERCA) */
        .toolbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 15px; display: flex; flex-direction: column; gap: 10px; z-index: 9; flex-shrink: 0; }
        .folders-nav { display: flex; overflow-x: auto; gap: 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 5px; }
        .folders-nav::-webkit-scrollbar { display: none; }
        .folder-tab { padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 800; white-space: nowrap; cursor: pointer; color: var(--text-muted); transition: 0.2s; border: 1px solid var(--border); background: var(--bg); display: flex; align-items: center; gap: 6px; }
        .folder-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
        .search-bar { width: 100%; padding: 10px 15px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-family: inherit; font-size: 13px; }
        .search-bar:focus { border-color: var(--accent); }

        /* SCORRIMENTO PRINCIPALE CON SUPER-BUFFER (Anti blocco tasti) */
        .content-scroll { 
            flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; 
            padding: 15px; 
            padding-bottom: calc(200px + var(--safe-bottom)); /* 200px garantiscono che il tasto + sia sempre raggiungibile */
            display: flex; flex-direction: column; gap: 20px; 
        }

        @media (min-width: 900px) { 
            .content-scroll { display: grid; grid-template-columns: repeat(2, 1fr); align-content: start; padding: 25px; padding-bottom: 150px; } 
            .toolbar { flex-direction: row; align-items: center; justify-content: space-between; } 
            .search-bar { width: 300px; } 
        }
        @media (min-width: 1400px) { .content-scroll { grid-template-columns: repeat(3, 1fr); } }
        
        /* GRIGLIA FRIGORIFERI E TABELLE */
        .card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.03); overflow: hidden; display: flex; flex-direction: column; position: relative; animation: fadeIn 0.3s ease; height: max-content; }

            flex-direction: column; position: relative; animation: fadeIn 0.3s ease; 
            flex-shrink: 0; /* ECCO IL FIX MAGICO! Niente più schiacciamenti. */
            height: auto; 
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-header { 
            padding: 15px; color: white; display: flex; justify-content: space-between; 
            align-items: center; font-weight: 800; font-size: 0.9rem; position: relative; 
            flex-shrink: 0; 
        }
        .card-progress-bg { position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: rgba(0,0,0,0.2); }
        .card-progress-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.4s ease; }

        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }

        td { padding: 12px 15px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 14px; }

        .role-badge { font-size: 9px; padding: 2px 6px; border-radius: 6px; background: var(--border); color: var(--text-muted); margin-left: 5px; vertical-align: middle; }

        .note-input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 13px; background: var(--bg); color: var(--text); border-color: var(--border); }
        .chk-wrap { display: flex; justify-content: center; }
        .chk-btn { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--border); background: var(--bg); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.15s; color: transparent; }
        .chk-btn.checked { background: var(--success); border-color: var(--success); color: white; transform: scale(1.05); }
        tr.is-done { opacity: 0.5; background: rgba(16, 185, 129, 0.05); }
        tr.is-done .prod-name { text-decoration: line-through; color: var(--success); }

        .edit-tools { display: none; margin-top: 10px; gap: 5px; }
        body.edit-mode .edit-tools { display: flex; }
        .btn-action { border: none; padding: 12px 15px; border-radius: 10px; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 13px; width: 100%; transition: 0.2s;}
        
        /* FIX FINESTRE E TASTIERA */
        .modal-overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); 
            display: none; justify-content: center; 
            align-items: flex-end; /* Allinea al basso per la tastiera */
            z-index: 2000; padding: 15px; padding-bottom: calc(15px + var(--safe-bottom)); 
        }
        @media (min-width: 768px) { .modal-overlay { align-items: center; } }

            background: var(--card); width: 100%; max-width: 500px; border-radius: 20px; padding: 25px; 
            max-height: 80dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; 
        }

            main { width: 100vw; }

<body>

    <div class="mobile-overlay" onclick="document.getElementById('sidebar').classList.remove('open')"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>CUCINA MANAGER <span>v4</span></h1>
        </div>

        <nav class="nav-group">
            <div class="nav-label">LE TUE SEDI</div>
            <div id="sedi-menu"></div>

            <div style="margin-top: 30px;" class="nav-label">Filtro Ruolo</div>
            <div class="nav-item active" onclick="setRoleFilter('tutti', this)"><i class="fa-solid fa-border-all"></i> Tutti i settori</div>
            <div class="nav-item" onclick="setRoleFilter('cucina', this)"><i class="fa-solid fa-fire-burner"></i> Cucina / Fritti</div>
            <div class="nav-item" onclick="setRoleFilter('pizzeria', this)"><i class="fa-solid fa-pizza-slice"></i> Pizzeria</div>
            <div class="nav-item" onclick="setRoleFilter('magazzino', this)"><i class="fa-solid fa-box-open"></i> Magazzino</div>

            <div style="margin-top: 30px;" class="nav-label">Gestione</div>
            <div class="nav-item" style="color: var(--accent);" onclick="openSyncModal()"><i class="fa-solid fa-cloud-arrow-up"></i> Sincronizza Cloud</div>
            <div class="nav-item" style="color: var(--warning);" onclick="generateReport()"><i class="fa-solid fa-clipboard-list"></i> Report Note / Spesa</div>
        </nav>

        <div class="sidebar-footer">
            <div class="nav-item edit-btn" onclick="toggleEditMode()" id="sidebar-edit-status">
                <i class="fa-solid fa-lock"></i> MODALITÀ LETTURA
            </div>
        </div>
    </aside>

    <main>
        <header class="top-bar">
            <div class="view-title">
                <button class="btn-icon" id="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fa-solid fa-bars"></i></button>
                <span id="header-title">Sede...</span>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div id="sync-indicator" style="font-size: 10px; font-weight: 800; color: var(--success); display: none;">● CLOUD OK</div>
                <button class="btn-icon" onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i></button>
                <button class="btn-icon" style="color: var(--danger);" onclick="smartReset()"><i class="fa-solid fa-rotate-left"></i></button>
            </div>
        </header>

        <div class="toolbar">
            <div class="folders-nav" id="folders-menu">
                </div>
            <input type="text" class="search-bar" id="search-input" placeholder="🔍 Cerca prodotto al volo..." onkeyup="renderContent()">
        </div>

        <div class="content-scroll" id="main-content"></div>
    </main>

    <div class="modal-overlay" id="modal-report">
        <div class="modal-box" style="max-width: 600px;">
            <h2 style="margin-top: 0; margin-bottom: 20px; display: flex; justify-content: space-between;">📋 Report Note <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="closeModals()"></i></h2>
            <div id="report-preview" style="background: var(--bg); padding: 15px; border-radius: 12px; font-size: 13px; max-height: 250px; overflow-y: auto; border: 1px solid var(--border); margin-bottom: 20px; white-space: pre-wrap;"></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <button class="btn-action" style="background: #25D366; color: white;" onclick="copyReportText()"><i class="fa-brands fa-whatsapp"></i> Invia Testo</button>
                <button class="btn-action" style="background: var(--primary); color: white;" onclick="downloadReportExcel()"><i class="fa-solid fa-file-excel"></i> Scarica CSV</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-sede">
        <div class="modal-box">
            <h3 id="modal-sede-title" style="margin-top: 0; margin-bottom: 20px;">Gestione Sede</h3>
            <div class="input-group"><label>Nome Sede (es. FIUMICINO)</label><input type="text" id="input-sede-name"></div>
            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button class="btn-action" style="background: var(--border); color: var(--text);" onclick="closeModals()">Annulla</button>
                <button class="btn-action" style="background: var(--accent); color: var(--primary);" onclick="saveSede()">Salva Sede</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-folder">
        <div class="modal-box">
            <h3 id="modal-folder-title" style="margin-top: 0; margin-bottom: 20px;">Gestione Cartella / Giorno</h3>
            <div class="input-group"><label>Nome Cartella (es. LUN/GIO, PREPARAZIONE)</label><input type="text" id="input-folder-name"></div>
            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button class="btn-action" style="background: var(--border); color: var(--text);" onclick="closeModals()">Annulla</button>
                <button class="btn-action" style="background: var(--accent); color: var(--primary);" onclick="saveFolder()">Salva Cartella</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-section">
        <div class="modal-box">
            <h3 id="modal-section-title" style="margin-top: 0; margin-bottom: 20px;">Gestione Frigorifero</h3>
            <div class="input-group"><label>Nome Settore (es. FRIGO PIZZE)</label><input type="text" id="input-section-name"></div>
            <div class="input-group"><label>Colore</label><select id="input-section-color"><option value="#0f172a">Grigio</option><option value="#0984e3">Blu (Pizzeria)</option><option value="#d63031">Rosso (Cucina)</option><option value="#00b894">Verde (Magazzino)</option></select></div>
            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button class="btn-action" style="background: var(--border); color: var(--text);" onclick="closeModals()">Annulla</button>
                <button class="btn-action" style="background: var(--accent); color: var(--primary);" onclick="saveSection()">Salva Frigo</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-item">
        <div class="modal-box">
            <h3 id="modal-item-title" style="margin-top: 0; margin-bottom: 20px;">Gestione Prodotto</h3>
            <div class="input-group"><label>Nome Prodotto</label><input type="text" id="input-item-name"></div>
            <div style="display: flex; gap: 10px;"><div class="input-group" style="flex:1;"><label>Linea (L)</label><input type="text" id="input-item-line"></div><div class="input-group" style="flex:1;"><label>Scorta (S)</label><input type="text" id="input-item-stock"></div></div>
            <div class="input-group"><label>Ruolo Competenza</label><select id="input-item-role"><option value="tutti">Tutti</option><option value="cucina">Solo Cucina</option><option value="pizzeria">Solo Pizzeria</option><option value="magazzino">Solo Magazzino</option></select></div>
            <div class="input-group"><label>Ricetta / Info</label><input type="text" id="input-item-info"></div>
            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button class="btn-action" style="background: var(--border); color: var(--text);" onclick="closeModals()">Annulla</button>
                <button class="btn-action" style="background: var(--accent); color: var(--primary);" onclick="saveItem()">Salva Prodotto</button>
            </div>
        </div>
    </div>
        <script>
        const CLOUD_KEY = "$2a$10$cANUKKt8gusYBU0s1g35UeBKFJM21uWzSe/ugzWuHGeZhj6C7KEui";
        
        let appStructure = JSON.parse(localStorage.getItem('cucina_v4_struct'));
        let appState = JSON.parse(localStorage.getItem('cucina_v4_state')) || {};
        let activeSede = null;
        let activeFolder = null;
        let activeRole = 'tutti';
        let editMode = false;
        let currentEdit = { action: null, sedeId: null, folderId: null, secId: null, itemId: null };

        function sanitize(str) { return (str || "").replace(/[<>"]/g, "'").trim(); }
        function generateId() { return Math.random().toString(36).substr(2, 9); }

        // --- AVVIO E CONNESSIONE CLOUD ---
        const urlParams = new URLSearchParams(window.location.search);
        const cloudBinId = urlParams.get('bin');
        const syncIndicator = document.getElementById('sync-indicator');

        if (cloudBinId) {
            syncIndicator.style.display = 'block'; syncIndicator.innerText = '⏳ DOWNLOAD...';
            fetch(`https://api.jsonbin.io/v3/b/${cloudBinId}/latest`, { headers: { 'X-Master-Key': CLOUD_KEY } })
            .then(res => res.json())
            .then(data => {
                if(data && data.record) {
                    appStructure = data.record; localStorage.setItem('cucina_v4_struct', JSON.stringify(appStructure));
                    alert("☁️ Dati scaricati dal Cloud!");
                    window.history.replaceState({}, document.title, window.location.pathname);
                    initApp();
                }
            }).catch(() => { alert("⚠️ Errore Cloud. Uso dati offline."); initApp(); });
        } else { initApp(); }

        function initApp() {
            // Struttura di default se l'app è vuota
            if (!appStructure || Object.keys(appStructure).length === 0) {
                const sid = 'sede_1', fid = 'fol_1', secid = 'sec_1';
                appStructure = {};
                appStructure[sid] = {
                    id: sid, name: "FIUMICINO",
                    folders: {}
                };
                appStructure[sid].folders[fid] = {
                    id: fid, name: "LUN / GIO",
                    sections: [{
                        id: secid, name: "FRIGO PIZZE", color: "#0984e3",
                        items: [{ id: "item_1", n: "Fiori di Zucca", l: "1/3", s: "2kg", role: "pizzeria", info: "Puliti" }]
                    }]
                };
                saveStructure();
            }
            activeSede = Object.keys(appStructure)[0];
            activeFolder = activeSede && Object.keys(appStructure[activeSede].folders)[0] ? Object.keys(appStructure[activeSede].folders)[0] : null;

            if (localStorage.getItem('cucina_v4_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            checkNewDay(); renderApp();
        }

        function saveStructure() { localStorage.setItem('cucina_v4_struct', JSON.stringify(appStructure)); syncIndicator.style.display='block'; syncIndicator.innerText='● DA INVIARE'; syncIndicator.style.color='var(--warning)'; }
        function saveState() { localStorage.setItem('cucina_v4_state', JSON.stringify(appState)); }
        function toggleTheme() { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); localStorage.setItem('cucina_v4_theme', t); }
        function checkNewDay() { const d = new Date().toLocaleDateString(); if (localStorage.getItem('cucina_v4_day') !== d) { appState = {}; saveState(); localStorage.setItem('cucina_v4_day', d); } }
        function smartReset() { if(confirm("🧹 Vuoi iniziare un nuovo turno pulito (azzera spunte)?")) { appState = {}; saveState(); renderContent(); } }

        // --- NAVIGAZIONE GLOBALE ---
        function setRoleFilter(role, el) {
            activeRole = role;
            document.querySelectorAll('.sidebar .nav-item').forEach(e => e.classList.remove('active'));
            if(el) el.classList.add('active');
            if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
            renderContent();
        }

        function toggleEditMode() {
            editMode = !editMode; document.body.classList.toggle('edit-mode', editMode);
            const btn = document.getElementById('sidebar-edit-status');
            btn.innerHTML = editMode ? `<i class="fa-solid fa-unlock"></i> MODIFICA ATTIVA` : `<i class="fa-solid fa-lock"></i> MODALITÀ LETTURA`;
            btn.style.color = editMode ? "var(--danger)" : "var(--warning)";
            renderApp();
        }

        function renderApp() {
            renderSidebar();
            renderFolders();
            renderContent();
        }

        // 1. Disegna le Sedi (Sidebar)
        function renderSidebar() {
            const menu = document.getElementById('sedi-menu'); menu.innerHTML = '';
            Object.values(appStructure).forEach(sede => {
                const div = document.createElement('div'); div.className = `nav-item ${sede.id === activeSede ? 'active' : ''}`; div.style.paddingLeft = "40px";
                div.innerHTML = `<i class="fa-solid fa-location-dot" style="font-size:12px;"></i> <span>${sede.name}</span>
                                 ${editMode ? `<div style="margin-left:auto; display:flex; gap:10px;"><i class="fa-solid fa-pen" style="color:var(--warning);" onclick="event.stopPropagation(); openSedeModal('${sede.id}')"></i><i class="fa-solid fa-trash" style="color:var(--danger);" onclick="event.stopPropagation(); deleteSede('${sede.id}')"></i></div>` : ''}`;
                div.onclick = () => { 
                    activeSede = sede.id; 
                    activeFolder = Object.keys(appStructure[sede.id].folders)[0] || null; 
                    renderApp(); 
                    if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open'); 
                };
                menu.appendChild(div);
            });
            if (editMode) {
                const add = document.createElement('div'); add.className = 'nav-item'; add.style.color = 'var(--success)'; add.style.paddingLeft = "40px";
                add.innerHTML = `<i class="fa-solid fa-plus"></i> NUOVA SEDE`; add.onclick = () => openSedeModal();
                menu.appendChild(add);
            }
        }

        // 2. Disegna le Cartelle/Giorni (Toolbar orizzontale)
        function renderFolders() {
            const menu = document.getElementById('folders-menu'); menu.innerHTML = '';
            document.getElementById('header-title').innerText = appStructure[activeSede] ? appStructure[activeSede].name : 'Seleziona Sede';
            if(!activeSede || !appStructure[activeSede]) return;

            Object.values(appStructure[activeSede].folders).forEach(fol => {
                const div = document.createElement('div'); div.className = `folder-tab ${fol.id === activeFolder ? 'active' : ''}`;
                div.innerHTML = `<span>${fol.name}</span>
                                 ${editMode ? `<i class="fa-solid fa-pen" style="color:var(--warning); margin-left:5px;" onclick="event.stopPropagation(); openFolderModal('${fol.id}')"></i><i class="fa-solid fa-xmark" style="color:var(--danger); margin-left:5px;" onclick="event.stopPropagation(); deleteFolder('${fol.id}')"></i>` : ''}`;
                div.onclick = () => { activeFolder = fol.id; renderContent(); renderFolders(); };
                menu.appendChild(div);
            });
            if (editMode) {
                const add = document.createElement('div'); add.className = 'folder-tab'; add.style.color = 'var(--success)'; add.style.border = '1px dashed var(--success)';
                add.innerHTML = `<i class="fa-solid fa-plus"></i> AGGIUNGI GIORNO`; add.onclick = () => openFolderModal();
                menu.appendChild(add);
            }
        }

        // 3. Disegna Frigoriferi e Prodotti (con Motore di Ricerca)
        function renderContent() {
            const container = document.getElementById('main-content'); container.innerHTML = '';
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            if(!activeSede || !activeFolder || !appStructure[activeSede].folders[activeFolder]) return;

            const folder = appStructure[activeSede].folders[activeFolder];

            folder.sections.forEach(sec => {
                // Filtri: Ruolo + Ricerca Testuale
                let itemsToShow = sec.items.filter(i => {
                    const matchRole = (activeRole === 'tutti' || i.role === activeRole || i.role === 'tutti');
                    const matchSearch = query === "" || i.n.toLowerCase().includes(query);
                    return matchRole && matchSearch;
                });

                if (itemsToShow.length === 0 && !editMode) return; // Nascondi frigo se vuoto

                const card = document.createElement('div'); card.className = 'card';
                let secHtml = `<div class="card-header" style="background: ${sec.color};"><span>${sec.name}</span>
                    ${editMode ? `<div style="display:flex; gap:12px;"><i class="fa-solid fa-pen" style="cursor:pointer;" onclick="openSectionModal('${sec.id}')"></i><i class="fa-solid fa-trash" style="cursor:pointer; color:var(--danger);" onclick="deleteSection('${sec.id}')"></i></div>` : ''}
                    <div class="card-progress-bg"><div class="card-progress-fill" id="prog-${sec.id}"></div></div></div>
                    <div style="overflow-x: auto;"><table>`;
                
                let doneCount = 0;
                itemsToShow.forEach(item => {
                    const stateKey = `${activeSede}_${activeFolder}_${sec.id}_${item.id}`;
                    const iState = appState[stateKey] || { c: false, n: "" };
                    if (iState.c) doneCount++;

                    // ALLARME NOTA: Se c'è una nota scritta, mostra il pallino rosso!
                    const noteAlert = (iState.n && iState.n.trim() !== "") ? '<span class="note-alert" title="Nota presente!"></span>' : '';
                    let roleB = item.role !== 'tutti' ? `<span class="role-badge">${item.role.substring(0,3).toUpperCase()}</span>` : '';

                    secHtml += `<tr class="${iState.c ? 'is-done' : ''}">
                        <td style="width: 45%;"><span class="prod-name">${item.n} ${roleB} ${noteAlert}</span>
                            <span class="prod-meta">L: ${item.l} • S: ${item.s} ${item.info ? `<i class="fa-solid fa-circle-info" style="color:var(--accent); margin-left:5px;" onclick="alert('${item.info.replace(/'/g, "\\'")}')"></i>` : ''}</span>
                            ${editMode ? `<div class="edit-tools"><button class="btn-action" style="background:var(--warning); color:#000;" onclick="openItemModal('${sec.id}', '${item.id}')"><i class="fa-solid fa-pen"></i></button><button class="btn-action" style="background:var(--danger); color:white; flex: 0 0 40px;" onclick="deleteItem('${sec.id}', '${item.id}')"><i class="fa-solid fa-trash"></i></button></div>` : ''}
                        </td>
                        <td style="width: 35%;"><input type="text" class="note-input" value="${iState.n}" placeholder="Nota..." onchange="updateState('${stateKey}', 'n', this.value)" ${editMode ? 'disabled' : ''}></td>
                        <td style="width: 20%;"><div class="chk-wrap"><div class="chk-btn ${iState.c ? 'checked' : ''}" onclick="if(!${editMode}) toggleCheck('${stateKey}')"><i class="fa-solid fa-check"></i></div></div></td>
                    </tr>`;
                });
                secHtml += `</table></div>`;

                if (editMode && query === "") {
                    secHtml += `<div style="padding:15px;"><button class="btn-action" style="background:rgba(56, 189, 248, 0.1); color:var(--accent); border: 1px dashed var(--accent);" onclick="openItemModal('${sec.id}')">+ AGGIUNGI PRODOTTO QUI</button></div>`;
                }

                card.innerHTML = secHtml; container.appendChild(card);
                
                setTimeout(() => {
                    const pb = document.getElementById(`prog-${sec.id}`);
                    if (pb && itemsToShow.length > 0) {
                        const p = Math.round((doneCount / itemsToShow.length) * 100);
                        pb.style.width = p + '%'; pb.style.background = p === 100 ? 'var(--warning)' : 'var(--success)';
                    }
                }, 50);
            });

            if (editMode && query === "") {
                const addS = document.createElement('button'); addS.className = 'btn-action'; addS.style.background = 'var(--success)'; addS.style.color = 'white'; addS.style.padding = '20px';
                addS.innerHTML = '+ CREA NUOVO FRIGORIFERO'; addS.onclick = () => openSectionModal(); container.appendChild(addS);
            }
        }

        // --- GESTIONE STATO ---
        function toggleCheck(k) { 
            if(!appState[k]) appState[k] = {c:false, n:""}; appState[k].c = !appState[k].c; 
            if(navigator.vibrate && appState[k].c) navigator.vibrate(40); 
            saveState(); renderContent(); 
        }
        function updateState(k, f, v) { 
            if(!appState[k]) appState[k] = {c:false, n:""}; appState[k][f] = sanitize(v); 
            saveState(); renderContent(); // Ricarica per far apparire l'allarme rosso se serve!
        }

        // --- CRUD FINESTRE MODALI ---
        function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }

        // CRUD Sedi
        function openSedeModal(id=null) { currentEdit={action: id?'edit':'new', sedeId: id}; document.getElementById('input-sede-name').value = id ? appStructure[id].name : ''; document.getElementById('modal-sede').style.display='flex'; }
        function saveSede() { const n = sanitize(document.getElementById('input-sede-name').value); if(!n) return;
            if(currentEdit.action==='new'){ const nid='sede_'+generateId(); appStructure[nid]={id:nid, name:n, folders:{}}; activeSede=nid; } else { appStructure[currentEdit.sedeId].name=n; }
            saveStructure(); closeModals(); renderApp(); }
        function deleteSede(id) { if(confirm("Eliminare Sede?")) { delete appStructure[id]; activeSede = Object.keys(appStructure)[0]||null; saveStructure(); renderApp(); } }

        // CRUD Folder (Giorni)
        function openFolderModal(id=null) { currentEdit={action: id?'edit':'new', folderId: id}; document.getElementById('input-folder-name').value = id ? appStructure[activeSede].folders[id].name : ''; document.getElementById('modal-folder').style.display='flex'; }
        function saveFolder() { const n = sanitize(document.getElementById('input-folder-name').value); if(!n) return;
            if(currentEdit.action==='new'){ const nid='fol_'+generateId(); appStructure[activeSede].folders[nid]={id:nid, name:n, sections:[]}; activeFolder=nid; } else { appStructure[activeSede].folders[currentEdit.folderId].name=n; }
            saveStructure(); closeModals(); renderFolders(); renderContent(); }
        function deleteFolder(id) { if(confirm("Eliminare Giorno?")) { delete appStructure[activeSede].folders[id]; activeFolder = Object.keys(appStructure[activeSede].folders)[0]||null; saveStructure(); renderFolders(); renderContent(); } }

        // CRUD Sezioni (Frigoriferi)
        function openSectionModal(id=null) { currentEdit={action: id?'edit':'new', secId: id};
            if(id){ const s=appStructure[activeSede].folders[activeFolder].sections.find(x=>x.id===id); document.getElementById('input-section-name').value=s.name; document.getElementById('input-section-color').value=s.color; }
            else { document.getElementById('input-section-name').value=''; document.getElementById('input-section-color').value='#0f172a'; }
            document.getElementById('modal-section').style.display='flex'; }
        function saveSection() { const n=sanitize(document.getElementById('input-section-name').value), c=document.getElementById('input-section-color').value; if(!n) return;
            if(currentEdit.action==='new') appStructure[activeSede].folders[activeFolder].sections.push({id:'sec_'+generateId(), name:n, color:c, items:[]});
            else { const s=appStructure[activeSede].folders[activeFolder].sections.find(x=>x.id===currentEdit.secId); s.name=n; s.color=c; }
            saveStructure(); closeModals(); renderContent(); }
        function deleteSection(id) { if(confirm("Eliminare Frigo?")) { appStructure[activeSede].folders[activeFolder].sections = appStructure[activeSede].folders[activeFolder].sections.filter(x=>x.id!==id); saveStructure(); renderContent(); } }

        // CRUD Prodotti
        function openItemModal(secId, itemId=null) { currentEdit={action: itemId?'edit':'new', secId:secId, itemId:itemId};
            const s=appStructure[activeSede].folders[activeFolder].sections.find(x=>x.id===secId);
            if(itemId){ const i=s.items.find(x=>x.id===itemId); document.getElementById('input-item-name').value=i.n; document.getElementById('input-item-line').value=i.l; document.getElementById('input-item-stock').value=i.s; document.getElementById('input-item-role').value=i.role||'tutti'; document.getElementById('input-item-info').value=i.info||''; }
            else { document.getElementById('input-item-name').value=''; document.getElementById('input-item-line').value=''; document.getElementById('input-item-stock').value=''; document.getElementById('input-item-role').value='tutti'; document.getElementById('input-item-info').value=''; }
            document.getElementById('modal-item').style.display='flex'; }
        function saveItem() { const n=sanitize(document.getElementById('input-item-name').value), l=sanitize(document.getElementById('input-item-line').value)||"-", stk=sanitize(document.getElementById('input-item-stock').value)||"-", r=document.getElementById('input-item-role').value, inf=sanitize(document.getElementById('input-item-info').value); if(!n) return;
            const s=appStructure[activeSede].folders[activeFolder].sections.find(x=>x.id===currentEdit.secId);
            if(currentEdit.action==='new') s.items.push({id:'item_'+generateId(), n:n, l:l, s:stk, role:r, info:inf});
            else { const i=s.items.find(x=>x.id===currentEdit.itemId); i.n=n; i.l=l; i.s=stk; i.role=r; i.info=inf; }
            saveStructure(); closeModals(); renderContent(); }
        function deleteItem(secId, itemId) { if(confirm("Eliminare Prodotto?")) { const s=appStructure[activeSede].folders[activeFolder].sections.find(x=>x.id===secId); s.items=s.items.filter(x=>x.id!==itemId); saveStructure(); renderContent(); } }

        // --- SISTEMA REPORT E CLOUD ---
        let reportData = [];
        function generateReport() {
            reportData = []; if(!activeSede || !activeFolder) return;
            const fol = appStructure[activeSede].folders[activeFolder];
            let txt = `SEDE: ${appStructure[activeSede].name} | ${fol.name}\nData: ${new Date().toLocaleDateString()}\n--------------------\n`;
            
            fol.sections.forEach(sec => {
                let sTxt = `\n[${sec.name.toUpperCase()}]\n`, has = false;
                sec.items.forEach(i => {
                    const k = `${activeSede}_${activeFolder}_${sec.id}_${i.id}`; const st = appState[k];
                    if(st && st.n && st.n.trim() !== "") { has=true; sTxt+=`- ${i.n}: ${st.n}\n`; reportData.push({s:sec.name, p:i.n, n:st.n}); }
                });
                if(has) txt += sTxt;
            });
            if(reportData.length===0) txt += "\n✅ Nessuna nota registrata.";
            document.getElementById('report-preview').innerText = txt;
            document.getElementById('modal-report').style.display='flex';
            if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
        }
        function copyReportText() { if(reportData.length===0) return; window.open("https://wa.me/?text=" + encodeURIComponent("📋 *REPORT CUCINA*\n" + document.getElementById('report-preview').innerText), '_blank'); }
        function downloadReportExcel() {
            if(reportData.length===0) return;
            let csv = "data:text/csv;charset=utf-8,\uFEFFFRIGO;PRODOTTO;NOTA\n";
            reportData.forEach(r => { csv += `"${r.s}";"${r.p}";"${r.n}"\n`; });
            const link = document.createElement("a"); link.setAttribute("href", encodeURI(csv)); link.setAttribute("download", `Spesa_${new Date().toLocaleDateString().replace(/\//g,'-')}.csv`);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        async function openSyncModal() {
            if(!confirm("Salvare struttura sul Cloud e condividere su WhatsApp?")) return;
            syncIndicator.style.display='block'; syncIndicator.innerText="⏳ CARICAMENTO...";
            try {
                const res = await fetch('https://api.jsonbin.io/v3/b', { method:'POST', headers:{'Content-Type':'application/json','X-Master-Key':CLOUD_KEY,'X-Bin-Name':'App_V4'}, body:JSON.stringify(appStructure) });
                const magicLink = window.location.href.split('?')[0] + '?bin=' + (await res.json()).metadata.id;
                window.open("https://wa.me/?text=" + encodeURIComponent("👨‍🍳 *CUCINA MANAGER V4*\n\nNuovo menu aggiornato. Clicca per sincronizzare:\n\n" + magicLink), '_blank');
                syncIndicator.innerText='☁️ CLOUD OK'; syncIndicator.style.color='var(--success)';
            } catch(e) { alert("⚠️ Errore Cloud."); syncIndicator.innerText='❌ OFFLINE'; syncIndicator.style.color='var(--danger)'; }
        }
    </script>
</body>
</html>
